[package]
name = "argos-core"
version.workspace = true
edition.workspace = true

[dependencies]
webrtc = "=0.21.0-rc.2"
rtc = "=0.21.0-rc.2"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
serde.workspace = true
serde_json = "1"
socket2 = "0.5"
if-addrs = "0.13"
ring = "0.17.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["time"] }